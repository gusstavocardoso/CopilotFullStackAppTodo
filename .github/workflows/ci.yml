name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Run backend tests with coverage
        run: |
          cd backend
          npm test -- --coverage

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  frontend-tests:
    name: Frontend Cypress Tests
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Start backend server
        env:
          MONGODB_URI: mongodb://localhost:27017/todo-test
          PORT: 4000
        run: |
          cd backend
          node server.js > ../backend.log 2>&1 &
          sleep 5

      - name: Show backend logs
        run: cat backend.log
        if: always()

      - name: Healthcheck backend (curl)
        run: |
          for i in {1..30}; do
            echo "Tentando acessar backend... tentativa $i"
            curl -s http://localhost:4000/todos && break
            sleep 2
          done

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm start
          wait-on: http://localhost:3000
          command: npm run cypress:run
